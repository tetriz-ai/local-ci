name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    if: github.repository == 'tetriz-ai/local-ci'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: "1.27.3"
      - name: Build reproducible archives and provenance
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GOTOOLCHAIN: go1.27.3
        run: python3 scripts/build-release.py --version "$RELEASE_TAG" --output "$RUNNER_TEMP/release"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" "$RUNNER_TEMP/release/"* --verify-tag --generate-notes
